name: Relay.app
description: >-
  Relay.app was a workflow automation platform (an AI-assisted alternative to
  Zapier and Make) that let teams build and run automated, multi-step workflows
  connecting external SaaS applications, with human-in-the-loop approval steps
  and AI actions embedded in the automation flow. It was surfaced as a portfolio
  company of a16z and added to the API Evangelist network. As of 2026 the product
  has been discontinued: free users lost access on 2026-08-15 and paying customers
  on 2026-09-14, with the site now serving a shutdown notice and a data-export
  path only. No public developer API, OpenAPI specification, SDKs, or webhook
  reference are published for the platform.
